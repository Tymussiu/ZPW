<head>

         crossorigin="anonymous">

    <script>
        // $(document).on("keypress keyup keydown", function(event){
        //     $("#eventType").text(event.type)
         
        // })

        // $(document).on("mousemove", function(event){
        //     $("#pageX").text(event.pageX)
        //     $("#pageY").text(event.pageY)
        // })

        $(document).on("keypress", function(event){
            if(event.key == "d"){
                $("#kwadrat").css("margin-left", "+=100px")
            }else if(event.key =="a"){
                $("#kwadrat").css("margin-left", "-=100px")
        }else if(event.key == "w"){
            $("#kwadrat").css("margin-top", "-=100px")
        }else if(event.key == "s"){
            $("#kwadrat").css("margin-top", "+=100px")
        }

        if(event.key == " "){
            $("#kwadrat").css({"background-color": "green","width": "+=50px","height": "+=50px"}
        )
            }else if(event.key == "-"){
                $("#kwadrat").css({"background-color": "red","width": "-=50px","height": "-=50px"})
        }
    
        $("#jabko").css({
    "margin-left": Math.floor(Math.random() * 500 + 1),
    "margin-top": Math.floor(Math.random() * 500 + 1)
});

    
    })
    </script>

    <style>
        #kwadrat{
            width: 200px;
            height: 200px;
            background-color: red;
        }
        #jabko{
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: rgb(0, 255, 21);
            border-radius: 50%;
        }
    </style>
</head>
