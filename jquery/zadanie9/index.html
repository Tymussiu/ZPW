<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
         crossorigin="anonymous">
         </script>
    <script>
           $(function(){
           $("#formularz").on("submit", function(e){
                e.preventDefault()
                // if($("#nick").val() == ""){
                //     $("#info").text("Nie podano nicku")
                // } else {
                //     $("#info").text("Witaj " + $("#nick").val())
                // }
                
                e.preventDefault()
                let email = $("#email").val()
                let haslo = $("#haslo").val()
                if(haslo.length < 6){
                    $("#info").text("Hasło jest za krótkie").css("color", "red")
                } else {
                    $("#info").text("zalaogwany").color("color", "black")
                }
           })

              $("#kolor").change( function(){
                 $("body").css("background-color", $(this).val())
              })
            $("#pizza").change(function(){
              if($("#pizza").val() == "mala"){
                $("#dozaplaty").text("Do zapłaty: 20zl")
              } else if($("#pizza").val() == "srednia"){
                $("#dozaplaty").text("Do zapłaty: 30zl")
              } else {
                $("#dozaplaty").text("Do zapłaty: 40zl")
              }
        })})
    </script>

    <style>
        
    </style>
</head>
<body>
            <form id="formularz">
        <input type="text" id="email"><br><br>
        <input type="password" id="haslo">
        <button type="submit">Wyslij</button>
    </form>
    <p id="info"></p>

    <hr>

    <select id="kolor">
        <option value="white">White</option>
        <option value="red">Red</option>
        <option value="blue">Blue</option>
    </select>

    <hr>
    <select id="pizza">
        <option value="mala">mala(20zl)</option>
        <option value="srednia">srednia(30zl)</option>
        <option value="duza">duzo(40zl)</option>
    </select>
    <p id="dozaplaty"></p>

</body>
</html>
