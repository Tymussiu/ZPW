<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
    #kwadrat { width: 150px; height: 150px; background: lightgray; }
  </style>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script>
        $(function() {
            // $("button").on("click", function() {
            //     $("#komunikat").text("Witaj!");
            // })
            let $licznik = 0;
            $("#kwadrat").on("click", function() {
                $("#kwadrat").css("background", "red");
                $licznik++;
                $("#komunikat").text($licznik);
            })
            
            $("#przywroc").on("click", function() {
                $("#kwadrat").css("background", "lightgray");
                $("#komunikat").text("");
            })


        })
    </script>
    <title>Document</title>
</head>
<body>
    <button id="przywitaj">Przywitaj się</button>
    <button id="przywroc">Przywroc</button>
  <p id="komunikat"></p>
 
  <div id="kwadrat"></div>
 

</body>
</html>
